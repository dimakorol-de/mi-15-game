name: Build Mi Band App
on: [push, workflow_dispatch]

jobs:
  build-rpk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install Hap-Toolkit
        run: npm install hap-toolkit

      - name: Generate Security Keys
        run: npx hap keygen --sign release # Создаем цифровые подписи для приложения

      - name: Compile RPK
        run: npx hap compile --sign release # Собираем подписанное приложение
        
      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: my-15-game
          path: "**/*.rpk"
