name: Build Mi Band App
on: [push, workflow_dispatch]

jobs:
  build-rpk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Install Hap-Tools
        run: npm install hap-tools # Устанавливаем официальный пакет внутрь сервера

      - name: Compile RPK
        run: ./node_modules/hap-tools/bin/index.js compile # Прямой вызов главного файла сборщика Xiaomi
        
      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: my-15-game
          path: dist/*.rpk
