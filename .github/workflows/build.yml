name: Build Mi Band App
on: [push, workflow_dispatch]

jobs:
  build-rpk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: 'npm'

      - name: Install Dependencies
        run: npm install # Теперь эта команда прочитает наш package.json и поставит всё правильно

      - name: Compile RPK
        run: npm run build # Запуск официальной сборки проекта
        
      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: my-15-game
          path: dist/*.rpk
